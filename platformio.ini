; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:uno_r4]
platform = renesas-ra
board = uno_r4_wifi
framework = arduino
lib_deps = coryjfowler/mcp_can@^1.5.1
monitor_speed = 115200
build_flags =
    -I src
    -I src/Asw
    -I src/Bsw/Adc
    -I src/Bsw/BswM
    -I src/Bsw/Can
    -I src/Bsw/CanIf
    -I src/Bsw/CanSM
    -I src/Bsw/CanTp
    -I src/Bsw/Com
    -I src/Bsw/ComM
    -I src/Bsw/CryIf
    -I src/Bsw/Crypto
    -I src/Bsw/Csm
    -I src/Bsw/KeyM
    -I src/Bsw/Dcm
    -I src/Bsw/Dem
    -I src/Bsw/Det
    -I src/Bsw/Dio
    -I src/Bsw/E2E
    -I src/Bsw/E2EXf
    -I src/Bsw/E2EMon
    -I src/Bsw/EcuM
    -I src/Bsw/Fee
    -I src/Bsw/FiM
    -I src/Bsw/Gpt
    -I src/Bsw/IoHwAb
    -I src/Bsw/Mcu
    -I src/Bsw/MemIf
    -I src/Bsw/Nm
    -I src/Bsw/NvM
    -I src/Bsw/PduR
    -I src/Bsw/Port
    -I src/Bsw/SchM
    -I src/Bsw/SecOC
    -I src/Bsw/Wdg
    -I src/Bsw/WdgIf
    -I src/Bsw/WdgM
    -I src/Hal
    -I src/Os
    -I src/Rte

; -----------------------------------------------------------------------
; ホスト(native)上での単体テスト環境。
; 実 HW（uno_r4/renesas-ra）に依存しない Bsw モジュールのロジックのみを
; GoogleTest で検証する。対象モジュールは build_src_filter で個別に
; 指定し、Hal/Det 等の実 HW 依存部分はテストごとの test/<name>/ 配下の
; フェイク実装に差し替える（詳細は test/test_gpt/ 参照）。
; -----------------------------------------------------------------------
[env:native]
platform = native
build_flags =
    -std=gnu++17
    -I src/Bsw/Can
    -I src/Bsw/Gpt
    -I src/Bsw/Det
    -I src/Bsw/SchM
    -I src/Hal
    -I test/fakes_include
build_src_filter = +<Bsw/Gpt/Gpt.c>
test_filter = test_gpt
test_build_src = yes
lib_deps = google/googletest@^1.14.0
test_framework = googletest

; E2E_P05.c は実HW依存の無い自己完結したロジックのため、Gpt用のフェイク実装
; 一式は不要。build_src_filter が [env] 単位で共有され Gpt.c まで一緒に
; ビルドされてしまう（Gpt.c 用フェイクを持たないためリンクエラーになる）ため、
; test_gpt とは別環境に分けている。
[env:native_e2e_p05]
platform = native
build_flags =
    -std=gnu++17
    -I src/Bsw/Can
    -I src/Bsw/E2E
build_src_filter = +<Bsw/E2E/E2E_P05.c>
test_filter = test_e2e_p05
test_build_src = yes
lib_deps = google/googletest@^1.14.0
test_framework = googletest
