[env:uno_r4]
platform = renesas-ra
board = uno_r4_wifi
framework = arduino
lib_deps = coryjfowler/mcp_can@^1.5.1
monitor_speed = 115200
build_flags =
    -I src
    -I src/Asw
    -I src/Bsw/Adc
    -I src/Bsw/BswM
    -I src/Bsw/Can
    -I src/Bsw/CanIf
    -I src/Bsw/CanSM
    -I src/Bsw/CanTp
    -I src/Bsw/Com
    -I src/Bsw/ComM
    -I src/Bsw/CryIf
    -I src/Bsw/Crypto
    -I src/Bsw/Csm
    -I src/Bsw/KeyM
    -I src/Bsw/Dcm
    -I src/Bsw/Dem
    -I src/Bsw/Det
    -I src/Bsw/Dio
    -I src/Bsw/E2E
    -I src/Bsw/E2EXf
    -I src/Bsw/E2EMon
    -I src/Bsw/EcuM
    -I src/Bsw/Fee
    -I src/Bsw/FiM
    -I src/Bsw/Gpt
    -I src/Bsw/IoHwAb
    -I src/Bsw/Mcu
    -I src/Bsw/MemIf
    -I src/Bsw/Nm
    -I src/Bsw/NvM
    -I src/Bsw/PduR
    -I src/Bsw/Port
    -I src/Bsw/SchM
    -I src/Bsw/SecOC
    -I src/Bsw/Wdg
    -I src/Bsw/WdgIf
    -I src/Bsw/WdgM
    -I src/Hal
    -I src/Os
    -I src/Rte

; -----------------------------------------------------------------------
; ホスト(native)上での単体テスト環境。
; 実 HW（uno_r4/renesas-ra）に依存しない Bsw モジュールのロジックのみを
; GoogleTest で検証する。全テストは test/test_native/ 1 フォルダに集約し、
; HAL 層（Hw ファイル）のみをフェイクに差し替え、その上位の実モジュールは
; 下位から順に build_src_filter へ積み上げていく（詳細は test/test_native/
; 参照）。1 つの native バイナリに全モジュール分のフェイクが揃っているため、
; モジュールをまたいだリンクエラーは起きない。
; -----------------------------------------------------------------------
[env:native]
platform = native
build_flags =
    -std=gnu++17
    ; CAN_UNIT_TEST: Can.h/Can.c にテスト専用アクセサ Can_Test_GetControllerState()
    ; を追加するコンパイルスイッチ。uno_r4 側の build_flags には絶対に付けないこと
    ; （実機バイナリに含めないため）。
    -D CAN_UNIT_TEST
    ; DET_LOG_LEVEL=LOG_T: 関数コールチェーン確認専用の TRACE ログまで出力する
    ; （既定 LOG_I は実機と同じ）。DET_LOG_VERBOSE=1 と併用して確認する
    ; （Det.h/Det_Cfg.h 参照）。uno_r4 側には付けない（実機では TRACE を出さない）。
    -D DET_LOG_LEVEL=LOG_T
    -I src/Bsw/Can
    -I src/Bsw/CanIf
    -I src/Bsw/Gpt
    -I src/Bsw/Det
    -I src/Bsw/SchM
    -I src/Bsw/E2E
    -I src/Hal
build_src_filter = +<Bsw/Gpt/Gpt.c> +<Bsw/E2E/E2E_P05.c> +<Bsw/E2E/E2E_P01.c> +<Bsw/Det/Det.c> +<Bsw/Can/Can.c>
test_filter = test_native
test_build_src = yes
lib_deps = google/googletest@^1.14.0
test_framework = googletest

; -----------------------------------------------------------------------
; コールチェーンテスト専用の別 native 環境。
; README の「Tx処理」「Rx処理」「CAN コントローラのスリープ制御」（実スリープ・
; ウェイクアップ検証）のようにモジュール横断でコールチェーンを実体
; （Com.c/PduR.c/CanIf.c/Can.c/CanSM.c）のままリンクして検証したいテストを
; ここに置く（test/test_chain/、Bsw_TxChain_test.cpp 参照）。[env:native]
; （test/test_native/）は Can.c 単体を CanIf フェイクで隔離する検証をしており、
; 同じバイナリに CanIf.c の本物を混在させるとシンボル多重定義になるため、
; env（＝ビルドディレクトリ・バイナリ）そのものを分けて共存させている。
;
; CanIf.c が CanSM_RxIndication()/ControllerBusOff()/ControllerWakeup() を
; ハードコードで呼ぶため、CanSM.c は実体・フェイクのいずれかをこのバイナリ
; 全体で選ぶ必要がある。Tx/Rx チェーン（Bsw_TxChain_test.cpp/
; Bsw_RxChain_test.cpp）は CanSM の状態遷移に関与しないが、CanSM 自身の
; コールチェーン（Bsw_WakeupChain_test.cpp）や Nm↔CanSM↔ComM 協調スリープ
; （Bsw_SleepCoordination_test.cpp）を同じ env で検証するため、CanSM.c は
; 実体をリンクしている。
;
; ComM.c/Nm.c も実体でリンクする（2026-08、当初は Nm/CanSM/ComM 協調スリープの
; 移管作業のリスクを既存5チェーンテストから切り離すため一時的に
; `[env:native_sleep_chain]` という別envに分離していたが、実機検証まで
; 完了し安定したため本envへ統合した）。ComM.c が呼ぶ EcuM_RequestRUN()/
; EcuM_ReleaseRUN()/BswM_ComM_CurrentMode() は境界としてフェイクに差し替える
; （test/test_chain/Bsw_EcuM_fake.h/Bsw_BswM_fake.h 参照）。Dem も同様に
; フェイクに差し替える（Bsw_Dem_fake.h 参照）。CanSM 状態遷移に関与しない
; Tx/Rx/E2E チェーンのテストは ComM_Init()/Nm_Init() を呼ばないため、
; これらのモジュールの実体は未初期化のまま（呼ばれない）で無害。
;
; E2E チェーン（README「Tx 処理」「Rx 処理」それぞれの「E2E」節、
; Bsw_TxE2EChain_test.cpp/Bsw_RxE2EChain_test.cpp）は E2EXf.c/E2EXf_PBCfg.c/
; E2E_P05.c/E2E_P01.c（E2EXf.c が両 Profile を参照するため）を実体でリンクする。
; 本番の TxTransformCbk/RxIndicationCbk（Rte_COMTransform_E2EHealthStatus()/
; Rte_COMCbk_EngineInfo() 等）は Rte.c 内にあるが、Rte.c 自体は IoHwAb/FiM/
; App_EngineManager/App_WarningIndicator まで巨大な依存グラフを引き込むため
; （Bsw_TxChain_test.cpp 冒頭コメントと同じ理由）リンクしない。各テストファイル
; 内に、本番の Rte_COMTransform_E2EHealthStatus()/Rte_COMCbk_EngineInfo() と
; 同じ1行の委譲呼び出しをテスト専用の TxTransformCbk/RxIndicationCbk として
; 定義し、E2EXf_TransformP05()/E2EXf_InverseTransformP05() から先は実体を
; そのまま検証する。E2EMon（E2E 検証結果のテレメトリ集計）はこのチェーンの
; 対象外（README の「E2E」節の図に含めていない別軸のため）。
;
; デッドライン監視チェーン（README「Rx 処理」の「デッドライン監視」節、
; Bsw_RxTimeoutChain_test.cpp）は PduR/CanIf/Can/CanSM を経由せず Com.c 単体で
; 完結するため、フェイクは millis()（Hal_Millis_fake.c）のみで足りる。
; -----------------------------------------------------------------------
[env:native_chain]
platform = native
build_flags =
    -std=gnu++17
    -D CAN_UNIT_TEST
    -D COM_UNIT_TEST
    ; DET_LOG_LEVEL=LOG_T: 関数コールチェーン確認専用の TRACE ログまで出力する
    ; （既定 LOG_I は実機と同じ）。DET_LOG_VERBOSE=1 と併用して確認する
    ; （Det.h/Det_Cfg.h 参照）。
    -D DET_LOG_LEVEL=LOG_T
    -I src/Bsw/Can
    -I src/Bsw/CanIf
    -I src/Bsw/CanSM
    -I src/Bsw/ComM
    -I src/Bsw/Com
    -I src/Bsw/PduR
    -I src/Bsw/Nm
    -I src/Bsw/EcuM
    -I src/Bsw/BswM
    -I src/Bsw/Dem
    -I src/Bsw/Det
    -I src/Bsw/SchM
    -I src/Bsw/E2EXf
    -I src/Bsw/E2E
    -I src/Hal
build_src_filter = +<Bsw/Det/Det.c> +<Bsw/Com/Com.c> +<Bsw/PduR/PduR.c>
    +<Bsw/CanIf/CanIf.c> +<Bsw/Can/Can.c> +<Bsw/CanSM/CanSM.c>
    +<Bsw/ComM/ComM.c> +<Bsw/Nm/Nm.c>
    +<Bsw/E2EXf/E2EXf.c> +<Bsw/E2EXf/E2EXf_PBCfg.c>
    +<Bsw/E2E/E2E_P05.c> +<Bsw/E2E/E2E_P01.c>
test_filter = test_chain
test_build_src = yes
lib_deps = google/googletest@^1.14.0
test_framework = googletest

; -----------------------------------------------------------------------
; Dcm（診断）専用の native 環境（2026-08 新設）。
; これまで Dcm_Cbk.c/Dem.c にはユニットテストが一切存在せず、実機 +
; uds_tester での手動検証のみに頼っていた（Com/Can とは異なる扱い）。
; UDS SID 0x19 ReadDTCInformation に subFunc 0x0A reportSupportedDTC を
; 追加した際、GitHub Issue #122 への回答で「ユニットテストで検証済み」と
; 案内するために、最小限のテスト基盤として新設した。
;
; Dcm_Cbk.c は CanTp/Rte/ComM/Com/Nm/KeyM に依存するが（Dcm_Cbk.c 冒頭の
; #include 参照）、これらは SID 0x19 の処理には一切関与しないため、
; [env:native_chain] のように実体をリンクせず、リンクを通すためだけの
; 最小スタブ（test/test_dcm/*_fake.c）に差し替える。Dem.c は実体をリンクする
; （[env:native_chain] は Bsw_Dem_fake.c で Dem をフェイクにしているため、
; 同じバイナリに混在させるとシンボル多重定義になる——これが env を分けた
; 理由そのもの）。Dem.c 自体が依存する NvM も同じ理由でスタブに差し替える
; （EEPROM 永続化のロジックは Dem のテスト対象外）。
; -----------------------------------------------------------------------
[env:native_dcm]
platform = native
build_flags =
    -std=gnu++17
    -D DET_LOG_LEVEL=LOG_T
    -I src/Bsw/Can
    -I src/Bsw/Dcm
    -I src/Bsw/Dem
    -I src/Bsw/Det
    -I src/Bsw/NvM
    -I src/Bsw/CanTp
    -I src/Bsw/ComM
    -I src/Bsw/Com
    -I src/Bsw/Nm
    -I src/Bsw/KeyM
    -I src/Rte
    -I src/Hal
build_src_filter = +<Bsw/Det/Det.c> +<Bsw/Dem/Dem.c> +<Bsw/Dcm/Dcm_Cbk.c>
test_filter = test_dcm
test_build_src = yes
lib_deps = google/googletest@^1.14.0
test_framework = googletest

; -----------------------------------------------------------------------
; WdgM 単体テスト環境。
; WdgM.c は WdgIf.h（下位ディスパッチ層）と Det.h の 2 つにしか依存しないため、
; 他 env と同じ考え方で WdgIf を呼び出し記録付きのフェイクに差し替え、
; WdgM.c/WdgM_PBCfg.c（実際の2エンティティ構成コンフィグ）と Det.c の実体を
; リンクする（test/test_wdgm/WdgIf_fake.c/h 参照）。millis() は他 env と同じ
; Hal_Millis_fake.c で固定値化し、テストから時刻を直接進める。
; -----------------------------------------------------------------------
[env:native_wdgm]
platform = native
build_flags =
    -std=gnu++17
    -D DET_LOG_LEVEL=LOG_T
    -I src/Bsw/Can
    -I src/Bsw/WdgM
    -I src/Bsw/WdgIf
    -I src/Bsw/Det
    -I src/Hal
build_src_filter = +<Bsw/Det/Det.c> +<Bsw/WdgM/WdgM.c> +<Bsw/WdgM/WdgM_PBCfg.c>
test_filter = test_wdgm
test_build_src = yes
lib_deps = google/googletest@^1.14.0
test_framework = googletest
