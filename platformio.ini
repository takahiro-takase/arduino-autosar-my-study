; https://docs.platformio.org/page/projectconf.html

[env:uno_r4]
platform = renesas-ra
board = uno_r4_wifi
framework = arduino
lib_deps = coryjfowler/mcp_can@^1.5.1
monitor_speed = 115200
build_flags =
    -I src
    -I src/Asw
    -I src/Bsw/Adc
    -I src/Bsw/BswM
    -I src/Bsw/Can
    -I src/Bsw/CanIf
    -I src/Bsw/CanSM
    -I src/Bsw/CanTp
    -I src/Bsw/Com
    -I src/Bsw/ComM
    -I src/Bsw/CryIf
    -I src/Bsw/Crypto
    -I src/Bsw/Csm
    -I src/Bsw/KeyM
    -I src/Bsw/Dcm
    -I src/Bsw/Dem
    -I src/Bsw/Det
    -I src/Bsw/Dio
    -I src/Bsw/E2E
    -I src/Bsw/E2EXf
    -I src/Bsw/E2EMon
    -I src/Bsw/EcuM
    -I src/Bsw/Fee
    -I src/Bsw/FiM
    -I src/Bsw/Gpt
    -I src/Bsw/IoHwAb
    -I src/Bsw/Mcu
    -I src/Bsw/MemIf
    -I src/Bsw/Nm
    -I src/Bsw/NvM
    -I src/Bsw/PduR
    -I src/Bsw/Port
    -I src/Bsw/SchM
    -I src/Bsw/SecOC
    -I src/Bsw/Wdg
    -I src/Bsw/WdgIf
    -I src/Bsw/WdgM
    -I src/Hal
    -I src/Os
    -I src/Rte

; -----------------------------------------------------------------------
; ホスト(native)上での単体テスト環境。
; 実 HW（uno_r4/renesas-ra）に依存しない Bsw モジュールのロジックのみを
; GoogleTest で検証する。全テストは test/test_native/ 1 フォルダに集約し、
; HAL 層（Hw ファイル）のみをフェイクに差し替え、その上位の実モジュールは
; 下位から順に build_src_filter へ積み上げていく（詳細は test/test_native/
; 参照）。1 つの native バイナリに全モジュール分のフェイクが揃っているため、
; モジュールをまたいだリンクエラーは起きない。
; -----------------------------------------------------------------------
[env:native]
platform = native
build_flags =
    -std=gnu++17
    ; CAN_UNIT_TEST: Can.h/Can.c にテスト専用アクセサ Can_Test_GetControllerState()
    ; を追加するコンパイルスイッチ。uno_r4 側の build_flags には絶対に付けないこと
    ; （実機バイナリに含めないため）。
    -D CAN_UNIT_TEST
    -I src/Bsw/Can
    -I src/Bsw/CanIf
    -I src/Bsw/Gpt
    -I src/Bsw/Det
    -I src/Bsw/SchM
    -I src/Bsw/E2E
    -I src/Hal
build_src_filter = +<Bsw/Gpt/Gpt.c> +<Bsw/E2E/E2E_P05.c> +<Bsw/Det/Det.c> +<Bsw/Can/Can.c>
test_filter = test_native
test_build_src = yes
lib_deps = google/googletest@^1.14.0
test_framework = googletest

; -----------------------------------------------------------------------
; コールチェーンテスト専用の別 native 環境。
; README の「Tx処理」「Rx処理」「CAN コントローラのスリープ制御」（実スリープ・
; ウェイクアップ検証）のようにモジュール横断でコールチェーンを実体
; （Com.c/PduR.c/CanIf.c/Can.c/CanSM.c）のままリンクして検証したいテストを
; ここに置く（test/test_chain/、Bsw_TxChain_test.cpp 参照）。[env:native]
; （test/test_native/）は Can.c 単体を CanIf フェイクで隔離する検証をしており、
; 同じバイナリに CanIf.c の本物を混在させるとシンボル多重定義になるため、
; env（＝ビルドディレクトリ・バイナリ）そのものを分けて共存させている。
;
; CanIf.c が CanSM_RxIndication()/ControllerBusOff()/ControllerWakeup() を
; ハードコードで呼ぶため、CanSM.c は実体・フェイクのいずれかをこのバイナリ
; 全体で選ぶ必要がある。Tx/Rx チェーン（Bsw_TxChain_test.cpp/
; Bsw_RxChain_test.cpp）は CanSM の状態遷移に関与しないが、CanSM 自身の
; コールチェーン（Bsw_SleepChain_test.cpp/Bsw_WakeupChain_test.cpp）を同じ
; env で検証するため、CanSM.c は実体をリンクしている。CanSM が呼び返す
; ComM/Dem は境界としてフェイクに差し替える（test/test_chain/Bsw_ComM_fake.h /
; Bsw_Dem_fake.h 冒頭コメント参照）。
; -----------------------------------------------------------------------
[env:native_chain]
platform = native
build_flags =
    -std=gnu++17
    -D CAN_UNIT_TEST
    -D COM_UNIT_TEST
    -I src/Bsw/Can
    -I src/Bsw/CanIf
    -I src/Bsw/CanSM
    -I src/Bsw/ComM
    -I src/Bsw/Com
    -I src/Bsw/PduR
    -I src/Bsw/Dem
    -I src/Bsw/Det
    -I src/Bsw/SchM
    -I src/Hal
build_src_filter = +<Bsw/Det/Det.c> +<Bsw/Com/Com.c> +<Bsw/PduR/PduR.c>
    +<Bsw/CanIf/CanIf.c> +<Bsw/Can/Can.c> +<Bsw/CanSM/CanSM.c>
test_filter = test_chain
test_build_src = yes
lib_deps = google/googletest@^1.14.0
test_framework = googletest
