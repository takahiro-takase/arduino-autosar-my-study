[env:uno_r4]
platform = renesas-ra
board = uno_r4_wifi
framework = arduino
lib_deps = coryjfowler/mcp_can@^1.5.1
monitor_speed = 115200
build_flags =
    -I src
    -I src/Asw
    -I src/Bsw/Adc
    -I src/Bsw/BswM
    -I src/Bsw/Can
    -I src/Bsw/CanIf
    -I src/Bsw/CanSM
    -I src/Bsw/CanTp
    -I src/Bsw/Com
    -I src/Bsw/ComM
    -I src/Bsw/CryIf
    -I src/Bsw/Crypto
    -I src/Bsw/Csm
    -I src/Bsw/KeyM
    -I src/Bsw/Dcm
    -I src/Bsw/Dem
    -I src/Bsw/Det
    -I src/Bsw/Dio
    -I src/Bsw/E2E
    -I src/Bsw/E2EXf
    -I src/Bsw/E2EMon
    -I src/Bsw/EcuM
    -I src/Bsw/Fee
    -I src/Bsw/FiM
    -I src/Bsw/Gpt
    -I src/Bsw/IoHwAb
    -I src/Bsw/Mcu
    -I src/Bsw/MemIf
    -I src/Bsw/Nm
    -I src/Bsw/NvM
    -I src/Bsw/PduR
    -I src/Bsw/Port
    -I src/Bsw/SchM
    -I src/Bsw/SecOC
    -I src/Bsw/Wdg
    -I src/Bsw/WdgIf
    -I src/Bsw/WdgM
    -I src/Hal
    -I src/Os
    -I src/Rte

; -----------------------------------------------------------------------
; コールチェーンテスト専用の別 native 環境。
; README の「Tx処理」「Rx処理」「CAN コントローラのスリープ制御」（実スリープ・
; ウェイクアップ検証）のようにモジュール横断でコールチェーンを実体
; （Com.c/PduR.c/CanIf.c/Can.c/CanSM.c）のままリンクして検証したいテストを
; ここに置く（test/、Bsw_TxChain_test.cpp 参照）。[env:native]
; （test/test_native/）は Can.c 単体を CanIf フェイクで隔離する検証をしており、
; 同じバイナリに CanIf.c の本物を混在させるとシンボル多重定義になるため、
; env（＝ビルドディレクトリ・バイナリ）そのものを分けて共存させている。
;
; CanIf.c が CanSM_RxIndication()/ControllerBusOff() を、Can.c が
; EcuM_CheckWakeup() 経由で CanSM_ControllerModeIndication() を
; ハードコードで呼ぶため（2026-09-05、旧 CanIf_ControllerWakeup() 経由から
; 変更。Fake_Bsw_EcuM.h 参照）、CanSM.c は実体・フェイクのいずれかを
; このバイナリ全体で選ぶ必要がある。Tx/Rx チェーン（Bsw_TxChain_test.cpp/
; Bsw_RxChain_test.cpp）は CanSM の状態遷移に関与しないが、CanSM 自身の
; コールチェーン（Bsw_WakeupChain_test.cpp）や Nm↔CanSM↔ComM 協調スリープ
; （Bsw_SleepCoordination_test.cpp）を同じ env で検証するため、CanSM.c は
; 実体をリンクしている。
;
; ComM.c/Nm.c も実体でリンクする（2026-08、当初は Nm/CanSM/ComM 協調スリープの
; 移管作業のリスクを既存5チェーンテストから切り離すため一時的に
; `[env:native_sleep_chain]` という別envに分離していたが、実機検証まで
; 完了し安定したため本envへ統合した）。ComM.c が呼ぶ EcuM_RequestRUN()/
; EcuM_ReleaseRUN()/BswM_ComM_CurrentMode() は境界としてフェイクに差し替える
; （test/Fake_Bsw_EcuM.h/Fake_Bsw_BswM.h 参照）。Dem も同様に
; フェイクに差し替える（Bsw_Dem_fake.h 参照）。CanSM 状態遷移に関与しない
; Tx/Rx/E2E チェーンのテストは ComM_Init()/Nm_Init() を呼ばないため、
; これらのモジュールの実体は未初期化のまま（呼ばれない）で無害。
;
; E2E チェーン（README「Tx 処理」「Rx 処理」それぞれの「E2E」節、
; Bsw_TxE2EChain_test.cpp/Bsw_RxE2EChain_test.cpp）は E2EXf.c/E2EXf_PBCfg.c/
; E2E_P05.c/E2E_P01.c（E2EXf.c が両 Profile を参照するため）を実体でリンクする。
; 本番の TxTransformCbk/RxIndicationCbk（Rte_COMTransform_E2EHealthStatus()/
; Rte_COMCbk_EngineInfo() 等）は Rte.c 内にあるが、Rte.c 自体は IoHwAb/FiM/
; App_EngineManager/App_WarningIndicator まで巨大な依存グラフを引き込むため
; （Bsw_TxChain_test.cpp 冒頭コメントと同じ理由）リンクしない。各テストファイル
; 内に、本番の Rte_COMTransform_E2EHealthStatus()/Rte_COMCbk_EngineInfo() と
; 同じ1行の委譲呼び出しをテスト専用の TxTransformCbk/RxIndicationCbk として
; 定義し、E2EXf_TransformP05()/E2EXf_InverseTransformP05() から先は実体を
; そのまま検証する。E2EMon（E2E 検証結果のテレメトリ集計）はこのチェーンの
; 対象外（README の「E2E」節の図に含めていない別軸のため）。
;
; デッドライン監視チェーン（README「Rx 処理」の「デッドライン監視」節、
; Bsw_RxTimeoutChain_test.cpp）は PduR/CanIf/Can/CanSM を経由せず Com.c 単体で
; 完結するため、フェイクは millis()（Fake_Hal_Millis.c）のみで足りる。
;
; GNU ld の `-Wl,--wrap=<symbol>` によるフォールトインジェクション
; （2026-09 新設、以前は [env:native_chain_wrap] という別 env で試作していたが、
; 2ラウンドの実績（CanSM Bus-Off回復・E2EXf SMCheck失敗分岐、いずれも
; test/Bsw_CanSM_BusOffRecovery_test.cpp/Bsw_E2EXf_SMCheckFailure_test.cpp
; 参照）を経て本 env へ統合した）。実体を丸ごとフェイクへ差し替えず、
; 境界の1関数だけをピンポイントで失敗させたい場合に使う
; （test/stub/Bsw/CanIf/Wrap_CanIf.h・test/stub/Bsw/E2E/Wrap_E2E.h 冒頭コメント参照）。
; 「stub は fake ファイルではなく wrap 方式で」という本プロジェクトの方針を
; 体現する。
;
; WdgM（2026-09、旧 [env:native_wdgm] から統合）。WdgM.c は WdgIf.h（下位
; ディスパッチ層）と Det.h/Dem.h にしか依存せず、native_chain の他モジュール
; （Can/CanIf/CanSM/ComM/Nm 等）と一切コールチェーンを共有しないため、
; test_native/test_dcm/test_fim/test_wdgm を test_chain へ統合するという長期
; ゴールの中で最も依存が軽い候補として最初に統合した。WdgIf は他 env に
; 同種モジュールが無いため専用フェイク（test/Fake_WdgIf.c/h）を
; そのまま持ち込んだ。統合した当時は Dem も Bsw_Dem_fake.h（現在は削除済み、
; 下記参照）へ差し替えるだけで済んでいたが、その後の Dem 実体リンク化により
; この経緯は過去のものになっている。
;
; Dem/FiM（2026-09、旧 [env:native_fim] から統合、上記 WdgM 統合の直後）。
; test_dcm/test_fim がどちらも Dem.c を実体リンクしているのに対し
; native_chain は Dem_SetEventStatus() の呼び出し記録だけが目的の単純な
; フェイク（Bsw_Dem_fake.c）を使っており、素直に統合すると
; CanSM/WdgM の各テストがこのフェイクの挙動（1回呼べば即座に記録される）に
; 依存している一方、Dem を実体化すると同じイベントでもデバウンス/DTC確定/
; EEPROM永続化まで絡む別物になってしまう。CanIf_SetControllerMode/
; E2E_SMCheck と同じ考え方（実体は保ったまま境界の1関数だけ観測する）で
; `-Wl,--wrap=Dem_SetEventStatus`（test/stub/Bsw/Dem/Wrap_Dem.h 参照）を導入し、
; 常に `__real_Dem_SetEventStatus()` へパススルーしつつ呼び出し回数・引数を
; 記録することで、Bsw_Dem_fake.h と全く同じ検証ができる状態を保ったまま
; Dem を実体化した（`FakeDem_*` → `WrapDemSetEventStatus_*` へ改称、
; test/ 内 11 ファイル・48 箇所を機械的に置換）。対象イベント
; （DEM_EVENT_CAN_BUSOFF/DEM_EVENT_WDGM_SUPERVISION）はいずれもデバウンス
; 閾値が1（Dem_Cfg.h の DEM_DEBOUNCE_LIMIT_*）のため、既存テストの「1回
; 呼べば確定/回復する」という前提はそのまま成立する。Dem の内部状態自体は
; テストケースを跨いで永続する static のため、各テストの SetUp() で
; `Dem_Init(NULL)` を追加（test/Fake_NvM.c により常に「初回起動」
; 相当の決定的なリセットになる、test_fim の既存テストと同じ手法）。
; FiM.c は Dem.h/Det.h にしか依存しないため、Dem を実体化した後は
; test_fim をそのまま統合するだけで済んだ。
;
; Dcm（2026-09、旧 [env:native_dcm] から統合、上記 Dem/FiM 統合の直後）。
; Dcm_Cbk.c は CanTp/Rte/KeyM の3モジュールへ依存するが、これらは
; native_chain の他モジュールと一切コールチェーンを共有しない純粋な
; リンクスタブ（test/Fake_CanTp.c/h・Fake_Rte.c・Fake_KeyM.c、
; 旧 test/test_dcm/*_fake から移設）のため、そのまま持ち込むだけで済んだ。
; BswM は Dcm_Cbk.c から見た通知先 BswM_Dcm_CommunicationMode_
; CurrentState() を、ComM.c 用の既存フェイク Fake_Bsw_BswM.c/h へ統合
; （対象関数は別だが `FakeBswM_Reset`/`FakeBswM_LastMode` のシンボル名が
; 衝突するため、Dcm 側のアクセサを `FakeBswM_LastDcmCommunicationMode`
; 等へ改称して統合）。ComM は native_chain が既に実体をリンクしているため
; （Nm↔CanSM↔ComM 協調スリープ検証用）、Dcm_Cbk.c が呼ぶ
; `ComM_DCM_ActiveDiagnostic()`/`ComM_DCM_InactiveDiagnostic()` を実体へ
; 到達させると、Dcm のテスト対象外である通信管理（Nm/CanSM 経由の実際の
; モード遷移）まで連鎖してしまう。旧 test_dcm 側のフェイクも単なる
; 何もしないリンクスタブだったため、`-Wl,--wrap=` でこの2関数を
; 「常に何もしない」よう隔離した（test/stub/Bsw/ComM/Wrap_ComM.c参照。
; CanIf/E2E/Dem の wrap とは異なり、既定パススルーではなく常時no-op という
; 特殊ケース）。Dem は既に実体化済みのため、Dcm_Cbk.c が呼ぶDem系API
; （Dem_GetFaultDetectionCounter等）もそのまま実体で検証できる。
;
; test_native（2026-09、旧 [env:native]/[env:native_coverage] から統合。
; test_native/test_dcm/test_wdgm/test_fim を test_chain へ統合するという
; 長期ゴールの最終回）。Gpt/Dio/Port は他モジュールと無縁の末端モジュールの
; ため、それぞれの HAL 層フェイク（test/Fake_Hal_Gpt_Hw.c 等、
; 旧 test/test_native から移設。単一 env でしか使わないため test/stub/Hal/
; へは寄せていない）ごとそのまま持ち込むだけで済んだ。Can.c 単体検証
; （Bsw_Can_test.cpp）だけは、Can.c が上位層通知として呼ぶ
; `CanIf_RxIndication()`/`CanIf_TxConfirmation()`/`CanIf_ControllerBusOff()`
; の3関数を、旧 `test/test_native/Bsw_CanIf_fake.h` が丸ごとフェイクに
; 差し替えていた（native_chain は既に CanIf.c を実体でリンクしているため、
; そのまま持ち込むとシンボル多重定義になる）。CanIf_SetControllerMode と
; 同じ`CanIf.c`が対象のため、新規ファイルは作らず`test/stub/Bsw/CanIf/
; Wrap_CanIf.c/h`へ追記する形で境界を`--wrap`化した。3関数とも
; （a）CanIf/CanSM側に未初期化ガードがあり、Bsw_Can_test.cppはCanIf_Init()/
; CanSM_Init()を呼ばないため実体へパススルーしても静かにno-opになるだけ、
; （b）Bsw_Can_test.cpp自体にDET報告回数の完全一致アサーションが1件も無い、
; の2点を確認した上で、ComMのときのような呼び出し元ごとの挙動トグルは
; 不要と判断し、単純な既定パススルーのみで実装した。EcuMは
; `EcuM_CheckWakeup()`が既存の`test/Fake_Bsw_EcuM.h`と完全に
; 同じ公開シンボルだったため、ファイルの変更は一切不要だった。
; -----------------------------------------------------------------------
[env:native_chain]
platform = native
build_flags =
    -std=gnu++17
    -D CAN_UNIT_TEST
    -D COM_UNIT_TEST
    ; DET_LOG_LEVEL=LOG_T: 関数コールチェーン確認専用の TRACE ログまで出力する
    ; （既定 LOG_I は実機と同じ）。DET_LOG_VERBOSE=1 と併用して確認する
    ; （Det.h/Det_Cfg.h 参照）。
    -D DET_LOG_LEVEL=LOG_T
    ; WDGM_UNIT_TEST: WdgM_Test_SetFirstExpiredSEIDRaw() を追加するコンパイル
    ; スイッチ（旧 [env:native_wdgm]、2026-09 に本 env へ統合）。
    -D WDGM_UNIT_TEST
    -Wl,--wrap=CanIf_SetControllerMode
    -Wl,--wrap=E2E_SMCheck
    -Wl,--wrap=Dem_SetEventStatus
    -Wl,--wrap=ComM_DCM_ActiveDiagnostic
    -Wl,--wrap=ComM_DCM_InactiveDiagnostic
    -Wl,--wrap=CanIf_RxIndication
    -Wl,--wrap=CanIf_TxConfirmation
    -Wl,--wrap=CanIf_ControllerBusOff
    -I src/Bsw/Can
    -I src/Bsw/CanIf
    -I src/Bsw/CanSM
    -I src/Bsw/ComM
    -I src/Bsw/Com
    -I src/Bsw/PduR
    -I src/Bsw/Nm
    -I src/Bsw/EcuM
    -I src/Bsw/BswM
    -I src/Bsw/Dcm
    -I src/Bsw/Dem
    -I src/Bsw/Det
    -I src/Bsw/SchM
    -I src/Bsw/E2EXf
    -I src/Bsw/E2E
    -I src/Bsw/WdgM
    -I src/Bsw/WdgIf
    -I src/Bsw/FiM
    -I src/Bsw/NvM
    -I src/Bsw/CanTp
    -I src/Bsw/KeyM
    -I src/Bsw/Gpt
    -I src/Bsw/Dio
    -I src/Bsw/Port
    -I src/Rte
    -I src/Hal
    -I test/stub/Bsw/CanIf
    -I test/stub/Bsw/E2E
    -I test/stub/Bsw/Dem
    -I test/stub/Bsw/ComM
    -I test/stub/Hal
build_src_filter = +<Bsw/Det/Det.c> +<Bsw/Com/Com.c> +<Bsw/PduR/PduR.c>
    +<Bsw/CanIf/CanIf.c> +<Bsw/Can/Can.c> +<Bsw/CanSM/CanSM.c>
    +<Bsw/ComM/ComM.c> +<Bsw/Nm/Nm.c>
    +<Bsw/E2EXf/E2EXf.c> +<Bsw/E2EXf/E2EXf_PBCfg.c>
    +<Bsw/E2E/E2E_P05.c> +<Bsw/E2E/E2E_P01.c> +<Bsw/E2E/E2E.c>
    +<Bsw/WdgM/WdgM.c> +<Bsw/WdgM/WdgM_PBCfg.c>
    +<Bsw/Dem/Dem.c> +<Bsw/FiM/FiM.c> +<Bsw/FiM/FiM_PBCfg.c>
    +<Bsw/Dcm/Dcm_Cbk.c>
    +<Bsw/Gpt/Gpt.c> +<Bsw/Dio/Dio.c> +<Bsw/Port/Port.c>
    +<../test/stub/Bsw/CanIf/Wrap_CanIf.c> +<../test/stub/Bsw/E2E/Wrap_E2E.c>
    +<../test/stub/Bsw/Dem/Wrap_Dem.c> +<../test/stub/Bsw/ComM/Wrap_ComM.c>
    +<../test/stub/Hal/Fake_Hal_Can_Hw.c> +<../test/stub/Hal/Fake_Hal_Det_Hw.c>
    +<../test/stub/Hal/Fake_Hal_Millis.c> +<../test/stub/Hal/Fake_Hal_SchM_Hw.c>
test_build_src = yes
lib_deps = google/googletest@^1.14.0
test_framework = googletest

; カバレッジ計測版。[env:native_chain] と全く同じ対象を、GCC の代わりに
; clang（llvm-mingw、MinGW を正式ターゲットとしたビルド、
; https://github.com/mstorsjo/llvm-mingw）でコンパイルし、Clang の
; source-based coverage（MC/DC 含む）を計測する（2026-09-19導入。当初は
; [env:native]/[env:native_coverage]（test/test_native/）で試作し、本コメントも
; そちらにあったが、2026-09にtest_nativeをtest_chainへ統合したのに合わせて
; 本envへ移設した）。
;
; PlatformIO の native プラットフォームは CC/CXX を OS 環境変数から読むが、
; リンクに使う `LINK` は別途固定値（g++）へ解決されてしまい CC/CXX の
; 上書きだけでは切り替わらないため、scripts/use_clang_coverage.py で
; SCons の env.Replace()/env.Append() を使い CC/CXX/LINK/AR/RANLIB と
; LINKFLAGS を直接上書きする（同ファイルのコメント参照）。
;
; 使い方（事前に llvm-mingw を導入し、その bin ディレクトリを
; 環境変数 LLVM_MINGW_BIN に設定してから呼ぶ。絶対パスを
; platformio.ini/スクリプトへハードコードしていないのはマシンごとに
; 設置先が異なるため、[[reference_pio_cli_location]] と同じ理由）:
;   export LLVM_MINGW_BIN="/c/Users/<you>/llvm-mingw-YYYYMMDD-ucrt-x86_64/bin"
;   pio test -e native_chain_coverage
;
; カバレッジレポートの生成手順（テスト実行後、`pio test` が作る
; .pio/build/native_chain_coverage/program.exe を直接対象にする。llvm-profdata/
; llvm-cov も LLVM_MINGW_BIN 配下にある）:
;   cd .pio/build/native_chain_coverage
;   LLVM_PROFILE_FILE=native_chain.profraw ./program.exe
;   "$LLVM_MINGW_BIN/llvm-profdata" merge -sparse native_chain.profraw -o native_chain.profdata
;   "$LLVM_MINGW_BIN/llvm-cov" report ./program.exe -instr-profile=native_chain.profdata --show-mcdc-summary
;   "$LLVM_MINGW_BIN/llvm-cov" show   ./program.exe -instr-profile=native_chain.profdata --show-mcdc -format=html -output-dir=coverage_html
; ----------------------------------------------------------------------
[env:native_chain_coverage]
platform = native
extra_scripts = pre:scripts/use_clang_coverage.py
build_flags =
    -std=gnu++17
    -D CAN_UNIT_TEST
    -D COM_UNIT_TEST
    -D DET_LOG_LEVEL=LOG_T
    -D WDGM_UNIT_TEST
    -fprofile-instr-generate -fcoverage-mapping -fcoverage-mcdc
    -Wl,--wrap=CanIf_SetControllerMode
    -Wl,--wrap=E2E_SMCheck
    -Wl,--wrap=Dem_SetEventStatus
    -Wl,--wrap=ComM_DCM_ActiveDiagnostic
    -Wl,--wrap=ComM_DCM_InactiveDiagnostic
    -Wl,--wrap=CanIf_RxIndication
    -Wl,--wrap=CanIf_TxConfirmation
    -Wl,--wrap=CanIf_ControllerBusOff
    -I src/Bsw/Can
    -I src/Bsw/CanIf
    -I src/Bsw/CanSM
    -I src/Bsw/ComM
    -I src/Bsw/Com
    -I src/Bsw/PduR
    -I src/Bsw/Nm
    -I src/Bsw/EcuM
    -I src/Bsw/BswM
    -I src/Bsw/Dcm
    -I src/Bsw/Dem
    -I src/Bsw/Det
    -I src/Bsw/SchM
    -I src/Bsw/E2EXf
    -I src/Bsw/E2E
    -I src/Bsw/WdgM
    -I src/Bsw/WdgIf
    -I src/Bsw/FiM
    -I src/Bsw/NvM
    -I src/Bsw/CanTp
    -I src/Bsw/KeyM
    -I src/Bsw/Gpt
    -I src/Bsw/Dio
    -I src/Bsw/Port
    -I src/Rte
    -I src/Hal
    -I test/stub/Bsw/CanIf
    -I test/stub/Bsw/E2E
    -I test/stub/Bsw/Dem
    -I test/stub/Bsw/ComM
    -I test/stub/Hal
build_src_filter = +<Bsw/Det/Det.c> +<Bsw/Com/Com.c> +<Bsw/PduR/PduR.c>
    +<Bsw/CanIf/CanIf.c> +<Bsw/Can/Can.c> +<Bsw/CanSM/CanSM.c>
