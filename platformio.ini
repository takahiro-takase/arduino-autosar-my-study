; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:uno_r4]
platform = renesas-ra
board = uno_r4_wifi
framework = arduino
lib_deps = coryjfowler/mcp_can@^1.5.1
monitor_speed = 115200
build_flags =
    -I src
    -I src/Asw
    -I src/Bsw/Adc
    -I src/Bsw/BswM
    -I src/Bsw/Can
    -I src/Bsw/CanIf
    -I src/Bsw/CanNm
    -I src/Bsw/CanTSyn
    -I src/Bsw/StbM
    -I src/Bsw/CanSM
    -I src/Bsw/CanTp
    -I src/Bsw/Com
    -I src/Bsw/ComM
    -I src/Bsw/CryIf
    -I src/Bsw/Crypto
    -I src/Bsw/Csm
    -I src/Bsw/KeyM
    -I src/Bsw/Dcm
    -I src/Bsw/Dem
    -I src/Bsw/Det
    -I src/Bsw/Dio
    -I src/Bsw/E2E
    -I src/Bsw/E2EXf
    -I src/Bsw/E2EMon
    -I src/Bsw/EcuM
    -I src/Bsw/Fee
    -I src/Bsw/FiM
    -I src/Bsw/Gpt
    -I src/Bsw/IoHwAb
    -I src/Bsw/Mcu
    -I src/Bsw/MemIf
    -I src/Bsw/Nm
    -I src/Bsw/NvM
    -I src/Bsw/PduR
    -I src/Bsw/Port
    -I src/Bsw/SchM
    -I src/Bsw/SecOC
    -I src/Bsw/Wdg
    -I src/Bsw/WdgIf
    -I src/Bsw/WdgM
    -I src/Hal
    -I src/Os
    -I src/Rte

; 2026-09-20: ホスト上の GoogleTest によるテスト（旧 [env:native_chain]/
; [env:native_chain_coverage]）は、PlatformIO の native プラットフォームの
; SCons ビルダーが CC/CXX を無条件に上書きし直すため clang++（llvm-mingw）へ
; 確実に切り替えられないという制約があり、CMake（リポジトリ直下の
; CMakeLists.txt/CMakePresets.json）へ移行した。build_src_filter・-I・
; --wrap 等の詳細、およびここに書いていた過去のテスト設計判断の経緯は
; CMakeLists.txt 冒頭のコメントを参照。本ファイルには [env:uno_r4]
; （実機 Arduino ビルド）のみを残す。


; MCP2518FD(CAN FD モジュール)の動作確認用。組み込みの通信スタックは使わない。
; 内部ループバックだけで、基板・配線・水晶・ライブラリを確かめる(tools/hw_check/mcp2518fd_loopback)。
[env:mcp2518fd_loopback]
platform = renesas-ra
board = uno_r4_wifi
framework = arduino
lib_deps = pierremolinaro/ACAN2517FD
monitor_speed = 115200
; UNO R4 のコアには NOT_AN_INTERRUPT が無い(digitalPinToInterrupt() はピン番号をそのまま返す)。
; ACAN2517FD が参照するため、-1 として定義する(ライブラリは書き換えない)。
build_flags = -DNOT_AN_INTERRUPT=-1
build_src_filter =
    -<*>
    +<../tools/hw_check/mcp2518fd_loopback/>

; MCP2518FD の SPI 応答を生の値で確かめる診断用(ライブラリなし。tools/hw_check/mcp2518fd_spi_diag)。
[env:mcp2518fd_spi_diag]
platform = renesas-ra
board = uno_r4_wifi
framework = arduino
monitor_speed = 115200
build_src_filter =
    -<*>
    +<../tools/hw_check/mcp2518fd_spi_diag/>

; MCP2518FD(CAN FD モジュール)で動かすビルド。Can_Hw を MCP2518FD 版(src/Hal/Can_Hw_Mcp2518fd.cpp)にする。
; uno_r4(MCP2515)とは、CAN_HW_MCP2518FD の有無で切り替える。
[env:uno_r4_fd]
extends = env:uno_r4
lib_deps =
    pierremolinaro/ACAN2517FD
; UNO R4 のコアには NOT_AN_INTERRUPT が無いため -1 として定義する(env:mcp2518fd_loopback を参照)。
build_flags =
    ${env:uno_r4.build_flags}
    -DCAN_HW_MCP2518FD
    -DNOT_AN_INTERRUPT=-1
