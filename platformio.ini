; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:uno_r4]
platform = renesas-ra
board = uno_r4_wifi
framework = arduino
lib_deps = coryjfowler/mcp_can@^1.5.1
monitor_speed = 115200
build_flags =
    -I src
    -I src/Asw
    -I src/Bsw/Adc
    -I src/Bsw/BswM
    -I src/Bsw/Can
    -I src/Bsw/CanIf
    -I src/Bsw/CanSM
    -I src/Bsw/CanTp
    -I src/Bsw/Com
    -I src/Bsw/ComM
    -I src/Bsw/CryIf
    -I src/Bsw/Crypto
    -I src/Bsw/Csm
    -I src/Bsw/KeyM
    -I src/Bsw/Dcm
    -I src/Bsw/Dem
    -I src/Bsw/Det
    -I src/Bsw/Dio
    -I src/Bsw/E2E
    -I src/Bsw/E2EXf
    -I src/Bsw/E2EMon
    -I src/Bsw/EcuM
    -I src/Bsw/Fee
    -I src/Bsw/FiM
    -I src/Bsw/Gpt
    -I src/Bsw/IoHwAb
    -I src/Bsw/Mcu
    -I src/Bsw/MemIf
    -I src/Bsw/Nm
    -I src/Bsw/NvM
    -I src/Bsw/PduR
    -I src/Bsw/Port
    -I src/Bsw/SchM
    -I src/Bsw/SecOC
    -I src/Bsw/Wdg
    -I src/Bsw/WdgIf
    -I src/Bsw/WdgM
    -I src/Hal
    -I src/Os
    -I src/Rte

; -----------------------------------------------------------------------
; ホスト(native)上での単体テスト環境。
; 実 HW（uno_r4/renesas-ra）に依存しない Bsw モジュールのロジックのみを
; GoogleTest で検証する。全テストは test/test_native/ 1 フォルダに集約し、
; HAL 層（Hw ファイル）のみをフェイクに差し替え、その上位の実モジュールは
; 下位から順に build_src_filter へ積み上げていく（詳細は test/test_native/
; 参照）。1 つの native バイナリに全モジュール分のフェイクが揃っているため、
; モジュールをまたいだリンクエラーは起きない。
; -----------------------------------------------------------------------
[env:native]
platform = native
build_flags =
    -std=gnu++17
    ; CAN_UNIT_TEST: Can.h/Can.c にテスト専用アクセサ Can_Test_GetControllerState()
    ; を追加するコンパイルスイッチ。uno_r4 側の build_flags には絶対に付けないこと
    ; （実機バイナリに含めないため）。
    -D CAN_UNIT_TEST
    -I src/Bsw/Can
    -I src/Bsw/CanIf
    -I src/Bsw/Gpt
    -I src/Bsw/Det
    -I src/Bsw/SchM
    -I src/Bsw/E2E
    -I src/Hal
build_src_filter = +<Bsw/Gpt/Gpt.c> +<Bsw/E2E/E2E_P05.c> +<Bsw/Det/Det.c> +<Bsw/Can/Can.c>
test_filter = test_native
test_build_src = yes
lib_deps = google/googletest@^1.14.0
test_framework = googletest
